<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Pago de Agua en Línea | EPS EMAPAT S.A. – Tayacaja</title>
  <meta name="description" content="Pague su recibo de agua potable de EPS EMAPAT de forma rápida y segura. Ingrese su código de suministro y pague en segundos.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://emapat.epsagua.com/pagos/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://emapat.epsagua.com/pagos/">
  <meta property="og:site_name" content="EPS EMAPAT S.A.">
  <meta property="og:title" content="Pago de Agua en Línea | EPS EMAPAT S.A.">
  <meta property="og:description" content="Pague su recibo de agua potable de EPS EMAPAT de forma rápida y segura desde cualquier dispositivo.">
  <meta property="og:locale" content="es_PE">
  <meta property="og:image" content="https://emapat.com.pe/administrador_pagina/Vista/usuario/logo/imagen_62b4c49fd5ccf.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pago de Agua en Línea | EPS EMAPAT S.A.">
  <meta name="twitter:description" content="Pague su recibo de agua potable de EPS EMAPAT rápido y seguro.">
  <meta name="twitter:image" content="https://emapat.com.pe/administrador_pagina/Vista/usuario/logo/imagen_62b4c49fd5ccf.png">

  <link href="https://emapat.com.pe/administrador_pagina/Vista/usuario/logo/imagen_62b4c49fd5ccf.png" rel="icon">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    *, body { font-family: 'Roboto', sans-serif; }

    html, body { height: 100%; margin: 0; }

    .fxt-bg {
      min-height: 100vh;
      background: linear-gradient(21deg, rgb(38,105,167) 0%, rgb(43,131,178) 42%, rgb(0,156,227) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .card-pago {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      max-width: 860px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      display: flex;
      flex-wrap: wrap;
    }

    /* Panel izquierdo — imagen */
    .panel-img {
      flex: 0 0 45%;
      max-width: 45%;
      overflow: hidden;
    }
    .panel-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Panel derecho — formulario */
    .panel-form {
      flex: 0 0 55%;
      max-width: 55%;
      padding: 44px 40px;
    }

    .titulo-empresa {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1565c0;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    /* Inputs estilo original — sin borde, solo línea inferior */
    .fxt-form .form-group {
      position: relative;
      margin-bottom: 20px;
    }
    .fxt-form .form-control {
      border: none;
      border-bottom: 1.5px solid #546e7a;
      border-radius: 0;
      padding: 10px 32px 10px 0;
      font-size: 0.9rem;
      color: #111;
      background: transparent;
      box-shadow: none;
    }
    .fxt-form .form-control:focus {
      box-shadow: none;
      border-bottom-color: #00b0ff;
      background: transparent;
    }
    .fxt-form .form-control::placeholder { color: #4f554f; font-weight: 300; }
    .fxt-form .form-group .field-icon {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      color: #a1a1a1;
      font-size: 1rem;
      pointer-events: none;
    }

    /* Checkbox */
    .form-check-label a { color: #00b0ff; }
    .form-check-input:checked { background-color: #00b0ff; border-color: #00b0ff; }

    /* Botón consultar */
    .btn-consultar {
      margin-top: 10px;
      background-color: #00b0ff;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 36px;
      font-size: 1rem;
      font-weight: 500;
      transition: background 0.25s;
    }
    .btn-consultar:hover { background-color: #1c9ed9; color: #fff; }

    /* Banda VISA */
    .visa-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }
    .visa-banner img { width: 80px; }
    .visa-banner p {
      font-size: 0.88rem;
      font-style: italic;
      color: #1565c0;
      font-weight: 500;
      margin: 0;
      line-height: 1.3;
    }

    /* Volver link */
    .volver-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.85);
      font-size: 0.85rem;
      margin-bottom: 20px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .volver-link:hover { color: #fff; }

    /* Responsive */
    @media (max-width: 640px) {
      .panel-img  { flex: 0 0 100%; max-width: 100%; height: 180px; }
      .panel-form { flex: 0 0 100%; max-width: 100%; padding: 28px 24px; }
    }

    /* Animación de entrada */
    .card-pago {
      opacity: 0;
      transform: translateY(30px);
      animation: slideUp 0.55s ease forwards 0.1s;
    }
    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Estados del formulario */
    #resultado { display: none; }
  </style>
</head>
<body>

<div class="fxt-bg">
  <div style="width:100%;max-width:860px;">

    <!-- Botón volver -->
    <a href="../index.html" class="volver-link">
      <i class="bi bi-arrow-left-circle"></i> Volver al inicio
    </a>

    <div class="card-pago">

      <!-- Imagen izquierda -->
      <div class="panel-img">
        <img src="https://sysco.emapat.com.pe/pagoWEB/assets/img/tarjetas.jpg"
             alt="Métodos de pago"
             onerror="this.src='https://via.placeholder.com/400x500/1565c0/ffffff?text=EMAPAT+Pagos'">
      </div>

      <!-- Formulario derecho -->
      <div class="panel-form">

        <!-- Título -->
        <div class="mb-3">
          <h2 class="titulo-empresa">EPS EMAPAT S.A.</h2>
          <p class="subtitulo">¡Bienvenido, pague su recibo!</p>
        </div>

        <!-- Formulario de consulta -->
        <form class="fxt-form" id="formConsulta" onsubmit="return consultarRecibo(event)">

          <div class="form-group">
            <input type="number" class="form-control" id="codigo" name="codigo"
                   placeholder="Código de suministro" required>
            <i class="bi bi-person field-icon"></i>
          </div>

          <div class="form-group">
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="Correo electrónico" required autocomplete="off">
            <i class="bi bi-envelope field-icon"></i>
          </div>

          <div class="form-group">
            <input type="number" class="form-control" id="dni" name="dni"
                   placeholder="Número de DNI (8 dígitos)" required maxlength="8"
                   oninput="if(this.value.length>8)this.value=this.value.slice(0,8)">
            <i class="bi bi-credit-card-2-front field-icon"></i>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="terminos" required>
            <label class="form-check-label small" for="terminos">
              Acepto los <a href="#" onclick="return false;">Términos y Condiciones</a>
            </label>
          </div>

          <button type="submit" class="btn-consultar" id="btnConsultar">
            CONSULTAR
          </button>
        </form>

        <!-- Resultado simulado -->
        <div id="resultado" class="mt-3">
          <div class="alert alert-info py-2 small" id="msgResultado"></div>
        </div>

        <!-- Banda VISA -->
        <div class="visa-banner">
          <img src="https://sysco.emapat.com.pe/pagoWEB/assets/img/figure/credit-card.gif"
               alt="Tarjeta" onerror="this.src='https://via.placeholder.com/80x50?text=VISA'">
          <p>Paga con VISA, en nuestros<br>canales digitales</p>
        </div>

      </div><!-- /panel-form -->
    </div><!-- /card-pago -->

    <p class="text-center mt-3" style="color:rgba(255,255,255,0.6);font-size:0.78rem;">
      &copy; 2026 EPS EMAPAT S.A. &mdash; Sistema de Pagos en Línea
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function consultarRecibo(e) {
  e.preventDefault();
  const dni = document.getElementById('dni').value;
  if (dni.length !== 8) {
    alert('Ingrese un número de DNI válido (8 dígitos).');
    document.getElementById('dni').focus();
    return false;
  }

  const btn = document.getElementById('btnConsultar');
  btn.textContent = 'Consultando...';
  btn.disabled = true;

  setTimeout(() => {
    const codigo = document.getElementById('codigo').value;
    const resultado = document.getElementById('resultado');
    const msg = document.getElementById('msgResultado');

    msg.innerHTML = `
      <strong>Recibo encontrado</strong><br>
      Suministro: <strong>${codigo}</strong><br>
      Importe pendiente: <strong>S/ 45.80</strong><br>
      Período: Mayo 2026<br><br>
      <button class="btn btn-sm" style="background:#00b0ff;color:#fff;border-radius:4px;" onclick="pagarRecibo()">
        Proceder al pago
      </button>`;
    resultado.style.display = 'block';
    btn.textContent = 'CONSULTAR';
    btn.disabled = false;
  }, 1200);

  return false;
}

function pagarRecibo() {
  const msg = document.getElementById('msgResultado');
  msg.className = 'alert alert-success py-2 small';
  msg.innerHTML = `<i class="bi bi-check-circle-fill me-1"></i>
    <strong>Pago registrado con éxito.</strong><br>
    Se enviará la constancia a su correo electrónico.`;
}
</script>
</body>
</html>
